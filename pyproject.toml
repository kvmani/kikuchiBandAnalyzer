[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kikuchi-band-analyzer"
dynamic = ["version"]
description = "Tools for Kikuchi band-width analysis and EBSD scan comparison."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2.0",
  "scipy>=1.10,<2.0",
  "pandas>=1.5,<3.0",
  "matplotlib>=3.7,<4.0",
  "scikit-image>=0.22,<0.23",
  "scikit-learn>=1.3,<2.0",
  "numba>=0.58,<1.0",
  "tqdm>=4.66,<5.0",
  "pyyaml>=6.0,<7.0",
  "opencv-python>=4.8,<5.0",
  "natsort>=8.4,<9.0",
  "h5py>=3.9,<4.0",
  "packaging>=23.2,<24.0",
  "PySide6>=6.5,<7.0",
  "hyperspy>=2.2,<3.0",
  "kikuchipy>=0.11,<0.12",
  "pyebsdindex>=0.3.9,<0.4",
  "orix>=0.13,<0.14",
  "pyxem>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]
docs = [
  "furo>=2024.8.6",
  "myst-nb>=1.1",
  "sphinx>=8",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "sphinxcontrib-mermaid>=1.0",
]

[project.scripts]
kikuchi-band-width = "kikuchiBandAnalyzer.band_width.cli:main"
kikuchi-band-detector = "kikuchiBandAnalyzer.band_width.detector_cli:main"
ebsd-compare = "kikuchiBandAnalyzer.ebsd_compare.gui.main_window:main"
oh5-to-ang-exporter = "kikuchiBandAnalyzer.oh5_to_ang_exporter.cli:main"
single-pattern-solver = "kikuchiBandAnalyzer.single_pattern_solver.solver:main"
single-pattern-solver-gui = "kikuchiBandAnalyzer.single_pattern_solver.gui:main"
indexing-debug-gui = "kikuchiBandAnalyzer.single_pattern_solver.gui:main"

[tool.setuptools]
packages = {find = {include = ["kikuchiBandAnalyzer*"]}}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["kikuchiBandAnalyzer"]
omit = ["*/gui/*"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
