input:
  type: ctf
  ctf_path: testData/hkl_ctf_test_data/Subset.ctf
  pattern_dir: testData/hkl_ctf_test_data/Binned_2x2
  pattern_template: "{x}_{y}.tiff"
  x: 7
  y: 10

phase:
  name: Cr
  space_group: 225
  lattice: [2.91, 2.91, 2.91, 90, 90, 90]
  atoms:
    - element: Cr
      position: [0, 0, 0]

detector:
  convention: oxford
  pc: [0.457, 0.584, 0.696374]
  sample_tilt: 70.0
  tilt: 0.0
  azimuthal: 0.0
  px_size: 1.0
  binning: 1

orientation:
  direction: lab2crystal

simulation:
  hkl_list: [[1, 1, 1], [2, 0, 0], [2, 2, 0], [3, 1, 1]]

band_profile:
  desired_hkl: "1,1,1"
  rectWidth: 20
  smoothing_sigma: 2.0
  min_psnr: 1.01

hough:
  enabled: true
  use_indexed_orientation: true
  n_bands: 5
  t_sigma: 2
  r_sigma: 2
