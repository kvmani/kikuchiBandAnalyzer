# OH5-to-ANG exporter configuration (non-interactive CLI mode)
# Run with:
# python -m kikuchiBandAnalyzer.oh5_to_ang_exporter.cli --config configs/oh5_to_ang_exporter.yml

oh5_path: testData/Test_Ti.oh5
ang_path: testData/Test_Ti.ang
output_ang_path: testData/Test_Ti_scaled_example.ang
include_mapping_note: false

# User-overridable mappings.
# Locked mappings are always applied automatically and cannot be overridden:
#   phi1 <- Phi1
#   PHI  <- Phi
#   phi2 <- Phi2
# Each mapping must define exactly one of:
#   - source: <oh5_field_name>
#   - formula: <expression_using_oh5_fields_and_constants>
mappings:
  - source: Fit
    target: SEM
    # Optional per-mapping transform: scale source min/max to this range.
    scale_enabled: true
    scale_target_min: 20000.0
    scale_target_max: 23000.0
    # Optional output token type: float (default), int (round nearest), auto.
    output_type: int
  - source: CI
    target: IQ
    output_type: float
  - formula: Band_Width * 100 + CI
    target: PRIAS Top Strip
    output_type: float
