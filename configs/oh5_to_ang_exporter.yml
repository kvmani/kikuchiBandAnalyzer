# OH5-to-ANG exporter configuration (non-interactive CLI mode)
# Run with:
# python -m kikuchiBandAnalyzer.oh5_to_ang_exporter.cli --config configs/oh5_to_ang_exporter.yml

oh5_path: testData/Test_Ti_modified.oh5
ang_path: testData/Test_Ti.ang
output_ang_path: testData/Test_Ti_modified.ang
include_mapping_note: false

# User-overridable mappings.
# Locked mappings are always applied automatically and cannot be overridden:
#   phi1 <- Phi1
#   PHI  <- Phi
#   phi2 <- Phi2
mappings:
  - source: Band_Width
    target: PRIAS Bottom Strip
  - source: psnr
    target: PRIAS Center Square
  - source: band_intensity_ratio
    target: PRIAS Top Strip
