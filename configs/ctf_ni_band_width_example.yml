# Example HKL/Oxford CTF + pattern-folder configuration for FCC Ni.
#
# Replace ctf_file_path, pattern_folder, detector PC, and detector geometry with
# values from your acquisition before running on real data.

ctf_file_path: path/to/Ni_scan.ctf
pattern_folder: path/to/Ni_patterns
pattern_template: null

desired_hkl: "111"
desired_hkl_ref_width: 1.0
elastic_modulus: 200000000000.0
rectWidth: 20
min_psnr: 1.05
smoothing_sigma: 2.0

hkl_list:
  - [1, 1, 1]
  - [2, 0, 0]
  - [2, 2, 0]

phase_list:
  name: Ni
  space_group: 225
  lattice: [3.5236, 3.5236, 3.5236, 90, 90, 90]
  atoms:
    - element: Ni
      position: [0, 0, 0]

ctf_detector:
  convention: oxford
  pc: [0.5, 0.5, 0.5]
  sample_tilt: 70.0
  tilt: 0.0
  azimuthal: 0.0
  px_size: 1.0
  binning: 1

ctf_euler_direction: lab2crystal
orientation_source: indexed
hough:
  enabled: true
  n_bands: 10
  t_sigma: 2.0
  r_sigma: 2.0
debug: false
plot_band_detection: false
plot_band_detection_condition: "False"
