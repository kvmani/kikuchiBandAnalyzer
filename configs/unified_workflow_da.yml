# Unified GUI example for the bundled TSL/EDAX nickel scan.
input:
  type: oh5
  path: testData/DA.oh5
  ang_path: testData/DA.ang
  x: 3
  y: 3

output_dir: outputs/unified_workflow_da

phase:
  name: Ni
  space_group: 225
  lattice: [3.5236, 3.5236, 3.5236, 90, 90, 90]
  atoms:
    - element: Ni
      position: [0, 0, 0]

detector:
  convention: edax
  pc: [0.547204, 0.710997, 0.696374]
  sample_tilt: 70.0
  tilt: 0.0
  azimuthal: 0.0

simulation:
  hkl_list: [[1, 1, 1], [2, 0, 0], [2, 2, 0], [3, 1, 1]]

band_profile:
  desired_hkl: "1,1,1"
  rectWidth: 20
  min_psnr: 1.01

desired_hkl_ref_width: 1.0
elastic_modulus: 205000000000.0
debug: false
orientation_source: indexed

hough:
  enabled: true
  use_indexed_orientation: true
  n_bands: 5

map_display:
  Band_Width:
    range_mode: auto
    percentile_low: 2.0
    percentile_high: 98.0
    scale: linear
    colormap: viridis
  strain:
    range_mode: auto
    percentile_low: 2.0
    percentile_high: 98.0
    scale: symlog
    symmetric: true
    linthresh: 0.001
    colormap: coolwarm
  stress:
    range_mode: auto
    percentile_low: 2.0
    percentile_high: 98.0
    scale: symlog
    symmetric: true
    linthresh: 1000000.0
    colormap: coolwarm
